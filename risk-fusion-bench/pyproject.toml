# 2026-07-23 改进计划 A5：钉住解释器与依赖（此文件在 source_tree_manifest 覆盖范围外）
[project]
name = "risk-fusion-bench"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "jsonschema>=4.18",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.setuptools.package-data]
"rfb" = ["contracts/*.json"]
"rfb.research" = ["contracts/*.json"]
