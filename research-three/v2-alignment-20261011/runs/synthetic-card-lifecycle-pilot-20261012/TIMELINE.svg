<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920">
<defs>
  <style>
    text { font-family: 'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif; fill: #172033; }
    .muted { fill: #627084; } .small { font-size: 13px; } .tiny { font-size: 11px; }
    .heading { font-size: 23px; font-weight: 700; } .subheading { font-size: 16px; font-weight: 700; }
    .table-head { fill: #edf2f7; } .row-a { fill: #ffffff; } .row-b { fill: #f8fafc; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#f3f6fb"/>
<text x="40" y="42" class="heading">合成卡片生命周期：通知动作与修订时间线</text>
<text x="40" y="68" class="small muted">SYNTHETIC MECHANISM CHECK ONLY · NOT DELIVERED · 不评估真实事件真值、传感器独立性或效果</text>
<rect x="40" y="88" width="1160" height="42" rx="8" fill="#fff4d6" stroke="#e4b84b"/>
<text x="58" y="114" class="small">稳定显示卡：CARD-SYNTH-LIFECYCLE-01　|　关联状态持续 UNKNOWN_PENDING　|　单一合成来源：SYNTH-SOURCE-ONE　|　模拟合并窗：5 秒</text>

<text x="40" y="166" class="subheading">主时间线</text>
<rect x="40" y="180" width="1160" height="38" rx="5" class="table-head"/>
<text x="56" y="204" class="small" font-weight="700">步骤 / 时间</text>
<text x="236" y="204" class="small" font-weight="700">动作与风险</text>
<text x="490" y="204" class="small" font-weight="700">台账决策</text>
<text x="750" y="204" class="small" font-weight="700">卡状态</text>
<text x="900" y="204" class="small" font-weight="700">修订数</text>
<text x="1050" y="204" class="small" font-weight="700">通知动作数</text>

<rect x="40" y="218" width="1160" height="46" class="row-a"/>
<text x="56" y="246" class="small">初始提醒 · t=0s</text>
<text x="236" y="246" class="small">ASSOCIATION_PENDING · EXPOSURE</text>
<text x="490" y="246" class="small">EMITTED</text>
<text x="750" y="246" class="small">ACTIVE</text>
<text x="925" y="246" class="small">1</text>
<text x="1080" y="246" class="small">1</text>
<line x1="40" y1="264" x2="1200" y2="264" stroke="#e4eaf1"/>
<rect x="40" y="264" width="1160" height="46" class="row-b"/>
<text x="56" y="292" class="small">持续更新 · t=1s</text>
<text x="236" y="292" class="small">ASSOCIATION_PENDING · EXPOSURE</text>
<text x="490" y="292" class="small">COALESCED_IN_PLACE</text>
<text x="750" y="292" class="small">ACTIVE</text>
<text x="925" y="292" class="small">2</text>
<text x="1080" y="292" class="small">1</text>
<line x1="40" y1="310" x2="1200" y2="310" stroke="#e4eaf1"/>
<rect x="40" y="310" width="1160" height="46" class="row-a"/>
<text x="56" y="338" class="small">精确重放 · t=2s</text>
<text x="236" y="338" class="small">ASSOCIATION_PENDING · EXPOSURE</text>
<text x="490" y="338" class="small">DUPLICATE_REPLAY_IGNORED</text>
<text x="750" y="338" class="small">ACTIVE</text>
<text x="925" y="338" class="small">2</text>
<text x="1080" y="338" class="small">1</text>
<line x1="40" y1="356" x2="1200" y2="356" stroke="#e4eaf1"/>
<rect x="40" y="356" width="1160" height="46" class="row-b"/>
<text x="56" y="384" class="small">风险升高 · t=3s</text>
<text x="236" y="384" class="small">ASSOCIATION_PENDING · EXPOSURE_HIGH</text>
<text x="490" y="384" class="small">EMITTED</text>
<text x="750" y="384" class="small">ACTIVE</text>
<text x="925" y="384" class="small">3</text>
<text x="1080" y="384" class="small">2</text>
<line x1="40" y1="402" x2="1200" y2="402" stroke="#e4eaf1"/>
<rect x="40" y="402" width="1160" height="46" class="row-a"/>
<text x="56" y="430" class="small">更正 · t=4s</text>
<text x="236" y="430" class="small">NOTICE_CORRECTED · EXPOSURE_HIGH</text>
<text x="490" y="430" class="small">EMITTED</text>
<text x="750" y="430" class="small">CORRECTED</text>
<text x="925" y="430" class="small">4</text>
<text x="1080" y="430" class="small">3</text>
<line x1="40" y1="448" x2="1200" y2="448" stroke="#e4eaf1"/>
<rect x="40" y="448" width="1160" height="46" class="row-b"/>
<text x="56" y="476" class="small">取消 · t=5s</text>
<text x="236" y="476" class="small">NOTICE_CANCELLED · EXPOSURE_HIGH</text>
<text x="490" y="476" class="small">EMITTED</text>
<text x="750" y="476" class="small">CANCELLED</text>
<text x="925" y="476" class="small">5</text>
<text x="1080" y="476" class="small">4</text>
<line x1="40" y1="494" x2="1200" y2="494" stroke="#e4eaf1"/>
<text x="56" y="498" class="tiny muted">精确重放仅记入审计轨迹：通知数与修订数不增加。风险升级、更正和取消各新增一个通知动作；更正与取消的修订保留在同一张卡的历史中。</text>

<text x="40" y="540" class="subheading">累计数量</text>
