<circle cx="1135.0" cy="606.0" r="5" fill="#2368d5"/><text x="1131.0" y="597.0" class="tiny" fill="#2368d5">4</text>
<polyline points="110.0,684.0 315.0,658.0 520.0,658.0 725.0,632.0 930.0,606.0 1135.0,580.0" fill="none" stroke="#6d49b8" stroke-width="3" stroke-linejoin="round"/>
