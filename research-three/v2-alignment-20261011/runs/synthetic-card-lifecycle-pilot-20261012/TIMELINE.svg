<circle cx="110.0" cy="684.0" r="5" fill="#2368d5"/><text x="106.0" y="675.0" class="tiny" fill="#2368d5">1</text>
<circle cx="315.0" cy="684.0" r="5" fill="#2368d5"/><text x="311.0" y="675.0" class="tiny" fill="#2368d5">1</text>
