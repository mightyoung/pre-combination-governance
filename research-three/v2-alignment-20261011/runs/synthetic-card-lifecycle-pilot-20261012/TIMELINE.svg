<line x1="970" y1="570" x2="1002" y2="570" stroke="#6d49b8" stroke-width="3"/><text x="1011" y="574" class="tiny">卡片修订</text>

<text x="40" y="790" class="subheading">反例：把取消误编码成普通更新</text>
<rect x="40" y="804" width="1160" height="74" rx="8" fill="#fff" stroke="#d5dde7"/>

<text x="58" y="830" class="small">决策：EMITTED → COALESCED_IN_PLACE → COALESCED_IN_PLACE</text>
<text x="58" y="852" class="small">通知动作：1 → 1 → 1　|　卡片修订：1 → 2 → 3　|　最终状态：ACTIVE</text>
<text x="40" y="902" class="tiny muted">反例只展示错误动作类型会被普通更新合并规则吸收；它不是实际取消事件，也不是效果证据。所有时间均来自合成输入；实际 emitted_at / visible_at 未运行。</text>
