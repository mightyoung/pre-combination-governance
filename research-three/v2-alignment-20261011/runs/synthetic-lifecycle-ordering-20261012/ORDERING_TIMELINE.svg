<rect width="100%" height="100%" fill="#f3f6fb"/>
<text x="38" y="40" class="title">通知版本、发生时间与到达顺序：合成边界检查</text>
<text x="38" y="66" class="small muted">SYNTHETIC MECHANISM ONLY · NOT DELIVERED · 版本顺序是本夹具假设，不代表私有 V2 或真实时钟结论</text>
<rect x="38" y="84" width="1304" height="56" rx="8" fill="#fff4d6" stroke="#e4b84b"/>
<text x="54" y="108" class="small">顺序分离：通知版本 = 1 → 3 → 2 → 3 → 1　|　来源发生偏移 = 0s → 2s → 1s → 2s → 0s　|　处理到达偏移 = 0s → 3s → 4s → 5s → 6s</text>
<text x="54" y="129" class="tiny muted">每条消息使用同一个合成来源标签；occurred_at 是夹具时间，不验证设备时钟或真实时间错位。</text>
